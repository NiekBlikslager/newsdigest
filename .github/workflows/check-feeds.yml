name: Check feeds

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: space-separated feed URLs to try (empty = check config/sources.yaml)"
        required: false
        default: ""
  push:
    paths: ["config/sources.yaml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m newsdigest.check_feeds ${{ inputs.urls }}
