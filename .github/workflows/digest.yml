name: Daily digest

on:
  schedule:
    # GitHub cron is in UTC and ignores daylight saving time. Two runs:
    # 04:45 UTC = 06:45 summer time, 05:45 UTC = 06:45 winter time.
    # The script skips the run that is too early, waits until 07:00 to send,
    # and never sends twice on the same day.
    - cron: "45 4 * * *"
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = no mail (download the result under Artifacts), test = one real [TEST] mail"
        type: choice
        options: [dry-run, test, collect-only]
        default: dry-run

permissions:
  contents: write   # to commit state/state.json

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m newsdigest --${{ inputs.mode }}
          else
            python -m newsdigest
          fi

      - name: Upload dry-run result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: output/

      - name: Save state (stories already sent)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "newsdigest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "Update digest state" && git push)
