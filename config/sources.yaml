# RSS feeds. Fields:
#   name:      shown in the digest
#   url:       the RSS/Atom feed
#   category:  hint for the selection model (free text)
#   paywall:   true = articles are usually behind a paywall (shown as "(betaalmuur)")
#   max_items: optional, max headlines taken from this feed per run (default 25)
# Run the "Check feeds" workflow (or: python -m newsdigest.check_feeds) after editing.

